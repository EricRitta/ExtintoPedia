services:
  db:
    image: docker.io/postgis/postgis:17-3.5-alpine
    container_name: extintopedia-db
    environment:
      POSTGRES_USER: extinto
      POSTGRES_PASSWORD: extinto_dev
      POSTGRES_DB: extintopedia
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Volume vazio (1ª subida ou `down -v`): o Postgres restaura o backup sozinho.
      - ./db/backup/extintopedia.sql.gz:/docker-entrypoint-initdb.d/01-extintopedia.sql.gz:ro
    healthcheck:
      # -h 127.0.0.1: o servidor temporário da restauração só escuta no socket,
      # então só fica "healthy" depois que o banco definitivo está no ar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U extinto -d extintopedia"]
      interval: 5s
      retries: 20

  app:
    build: ./app
    container_name: extintopedia-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:5173:3001"
    volumes:
      - ./data:/srv/data   # imagens do pipeline (leitura)
      - mapas:/srv/data/mapas   # mapas baixados sob demanda: ficam só no container, não na máquina
volumes:
  pgdata:
  mapas:
